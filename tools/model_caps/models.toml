# models.toml - the wire-shape facts of every model the firmware names (lane E2-R1; design:
# program-2026-10-18/analysis-2026-11-24/ROUTER-DESIGN.md sections 3 and 9).
#
# Hand-curated. tools/model_caps/gen_caps.py lints it and writes
# lib/core/include/nimbus/orch/model_caps_data.h (never edit that file by hand).
#
# NOT here, on purpose: context windows, output caps, read windows, decode rates and prices.
# They live in the shared functions both engines read (headWindowTokens, outputCapFor,
# readWindowMsFor, builtinModelPrice); test/test_model_caps proves every row below resolves
# there to a non-default window and a non-fallback price.
#
# Every value is an inline table: v (the value), src (a [sources] id, optionally "#detail", or a
# repo path with lines, "lib/...cpp:12-20"), read (the date it was read, YYYY-MM-DD) and ver:
#   docs      the provider's official documentation says so
#   code      the project's code does so today (recorded behaviour behind it, cited in the code)
#   probe     a live probe the project ran and recorded
#   recorded  a recorded live run or fixture shows it
#   none      sourced, but not verified (a community page, an inference); the battery report lists it
#   default   no source for this model: the fail-safe default of design section 3.2
# Where the provider's documents and the project's recorded behaviour disagree, the project's
# recorded behaviour is entered and the disagreement is named in `note` (and in the PR body).
#
# Web facts were read on 2026-11-24 (07:01 UTC) for P/analysis-2026-11-24/
# research-provider-wire-facts.md from the URLs below; code facts were read in this tree.

schema = 1


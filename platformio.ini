; Nimbus - battery-powered desk device on the Solide S3 board
; (ESP32-S3-DevKitC-1 N16R8, consumed via ../solide-drivers as a library).
;
;   Host unit tests:  pio test -e native        (no hardware needed)
;   Firmware install: python3 tools/setup_device.py  (guarded UART selection)
;
; The pioarduino platform pin (55.03.39) mirrors solide-drivers' validated
; toolchain - keep the two in lockstep when bumping.

[platformio]
default_envs = native

; ---- Host-side unit tests: portable logic lives in lib/core (no Arduino) ----
; -I../solide-drivers/include exposes the solide:: portable headers (ring, menu,
; encoder_decode) to lib/core on the host; the device build gets them via lib_deps.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -I../solide-drivers/include -DNIMBUS_NATIVE
build_src_filter = -<*>
; ArduinoJson v7 is header-only and host-safe - it backs the portable orchestrator
; turn parser + journal + device-action validator (lib/core/src/orch_*.cpp) under
; pio test -e native.
lib_deps =
    bblanchon/ArduinoJson@^7

[s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/git_version.py
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DNIMBUS_NO_COLOR_EINK   ; drop the unused 3-colour e-ink instance (~9.6 KB internal SRAM)
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DSOLIDE_BOARD=solide_s3
    -DNIMBUS_HAS_BATTERY_ADC
    ; Cloud relay: the tunneled response body (up to a full device UI page) is buffered
    ; in PSRAM, not the scarce internal SRAM. Set for EVERY firmware env so the
    ; http_replay BodyBuf type is identical across TUs (ODR). Native/host leaves it off.
    -DNIMBUS_RELAY_PSRAM_BODY
    ; AsyncTCP service-task stack. ⚠ The task is NOT TLS-free: GET /api/mem/vector
    ; and POST /mcp memory.write run a blocking mbedTLS embed INLINE on it (the same
    ; handshake depth class that overflowed tg_poll). Measured on-device 2026-08-05:
    ; a memory.write embed peaks at 6,536 B, so the earlier 8 KB left only ~1.6 KB
    ; headroom (80% used) - too tight for varying cert/content. 12 KB gives ~5.7 KB
    ; margin; the tg_poll task keeps its 24 KB (see telegram.cpp). Net internal-SRAM
    ; cost vs a 16/16 split is +4 KB (resting free ~35.6 KB, well above the turn floor).
    ; High-water is surfaced in /api/state (mem.asyncStackMin) - watch it stay >1.5 KB.
    -DCONFIG_ASYNC_TCP_STACK_SIZE=12288
lib_deps =
    ; Board support. The public pinned tag is the default so a fresh clone
    ; builds with no siblings; for local driver development, clone
    ; solide-drivers next to this repo and swap in the symlink line instead.
    https://github.com/ristllin/solide-drivers.git#v0.5.1
    ; symlink://../solide-drivers
    bblanchon/ArduinoJson@^7
    https://github.com/ESP32Async/AsyncTCP.git
    https://github.com/ESP32Async/ESPAsyncWebServer.git
    ; BLE nsn transport (src/net/ble_notifier). 2.x is the Arduino-core-3/IDF5
    ; line (1.x targets core 2.x) - keep pinned alongside the platform above.
    h2zero/NimBLE-Arduino@^2.5

[env:esp32s3]
extends = s3
build_src_filter = +<*> -<bringup/>
; OTA manifest variant tag - which variants{} entry of a release manifest this
; build installs (src/sys/ota_update). Envs without the tag report "unsupported".
build_flags = ${s3.build_flags} -DNIMBUS_OTA_VARIANT=\"esp32s3\"

; Freenove ESP32-S3 Display (FNK0104B) all-in-one board: same ESP32-S3 N16R8, a
; DIFFERENT pinout (ILI9341 on its own SPI bus, FT6336U capacitive touch, ES8311
; codec, SDMMC card, single WS2812). Selected entirely at compile time via
; -DSOLIDE_BOARD=freenove_s3 (board pinout is never web-selectable - a wrong pin
; map on an all-in-one PCB can drive fixed peripherals). Its own OTA variant
; "cyd" so a cyd image can never be delivered to a solide_s3 unit and vice-versa.
;   pio run -e esp32s3-cyd
[env:esp32s3-cyd]
extends = s3
build_src_filter = +<*> -<bringup/>
build_unflags = -DSOLIDE_BOARD=solide_s3
build_flags = ${s3.build_flags} -DSOLIDE_BOARD=freenove_s3 -DNIMBUS_OTA_VARIANT=\"cyd\"

; Notifier device with a device->host status echo for E2E validation (the
; production esp32s3 build stays silent so the nsn stream is clean).
;   pio run -e notifierdbg -t upload
[env:notifierdbg]
extends = s3
build_src_filter = +<*> -<bringup/>
build_flags = ${s3.build_flags} -DNIMBUS_NOTIFIER_DEBUG

; Full product firmware PLUS the serial test-affordances (test_console: command
; console, boot beacon, render-state emit, WiFi-reason surfacing) for the HIL
; harness (tests/hil/). Same product build as esp32s3 (identical
; build_src_filter) with -DNIMBUS_TEST added; NIMBUS_NOTIFIER_DEBUG is kept on so
; live orch-hang tracing still works - the two flags are independent layers.
; NEVER the flash target for a production unit.
;   pio run -e test -t upload
[env:test]
extends = s3
build_src_filter = +<*> -<bringup/>
build_flags = ${s3.build_flags} -DNIMBUS_TEST -DNIMBUS_NOTIFIER_DEBUG -DNIMBUS_OTA_VARIANT=\"test\"

; test-cyd - the [env:test] console build for the Freenove CYD board
; (SOLIDE_BOARD=freenove_s3). Its own OTA variant "test-cyd" so it is never
; interchangeable with a solide_s3 "test" image. Drives HIL + bench bring-up.
;   pio run -e test-cyd -t upload --upload-port <freenove usbmodem>
[env:test-cyd]
extends = s3
build_src_filter = +<*> -<bringup/>
build_unflags = -DSOLIDE_BOARD=solide_s3
build_flags = ${s3.build_flags} -DSOLIDE_BOARD=freenove_s3 -DNIMBUS_TEST -DNIMBUS_NOTIFIER_DEBUG -DNIMBUS_OTA_VARIANT=\"test-cyd\"

; bttest - identical to [env:test] but advertises BLE as "Nimbus-BT" so a bench
; test board on the `bt-secure-pairing` branch is unambiguously distinguishable
; over BLE from a production "Nimbus" on the same desk (macOS hides the MAC).
; Flash the SPARE bench board with this; never the primary (verify by MAC).
;   pio run -e bttest -t upload --upload-port /dev/cu.usbmodemSPARE
[env:bttest]
extends = s3
build_src_filter = +<*> -<bringup/>
build_flags = ${s3.build_flags} -DNIMBUS_TEST -DNIMBUS_NOTIFIER_DEBUG -DNIMBUS_OTA_VARIANT=\"test\" -DNIMBUS_BLE_NAME=\"Nimbus-BT\"

; Minimal speaker beep - isolates the audio amp/speaker from the full firmware.
;   pio run -e beep -t upload
[env:beep]
extends = s3
build_src_filter = -<*> +<bringup/beep.cpp>

; Minimal LED-ring data-path test - GPIO 21 only, two independent RMT writers
; (Adafruit_NeoPixel wipes + core neopixelWrite pixel-0 blink), progress on both
; consoles. Isolates the ring from the full firmware the way beep does the amp.
;   pio run -e ledring -t upload
[env:ledring]
extends = s3
build_src_filter = -<*> +<bringup/ledring.cpp>

; Minimal I2S mic bring-up - verifies the INMP441/ICS-43434 read path (RMS) +
; speaker+mic concurrent loopback, decoupled from the full-firmware boot.
;   pio run -e mictest -t upload
[env:mictest]
extends = s3
build_src_filter = -<*> +<bringup/mictest.cpp>

; Minimal TFT + touch bring-up - verifies the ILI9341 panel lights up, the
; colours are not BGR-swapped, the backlight PWM works, and XPT2046 reports
; sane coordinates. Decoupled from the full-firmware boot so a panel fault is
; not masked by anything else.
;   pio run -e tftbringup -t upload
; tftmin - the smallest program that puts something on the panel: init, one
; solid fill, then leave it alone. No Wi-Fi/BLE/touch/SD/LED-ring/watchdog and
; no repaint loop. Exists to take the variables OUT of the blank-screen fault:
; if the colour holds here, the panel is fine and the full firmware is doing
; something to it; if it goes white with nothing running, it is hardware.
;   pio run -e tftmin -t upload
[env:tftmin]
extends = s3
build_src_filter = -<*> +<bringup/tftmin.cpp>

; UART variant - the DevKit's CP2102 "UART" port, which is the cable actually
; plugged in on this bench. Without this the report goes to the native-USB CDC
; and is invisible.
[env:tftmin-uart]
extends = env:tftmin
build_flags = ${env:tftmin.build_flags} -UARDUINO_USB_CDC_ON_BOOT -DARDUINO_USB_CDC_ON_BOOT=0

; tfttouch - five on-screen buttons: press them and the band up top takes that
; button's colour. Proves display, touch AND calibration together, because a
; swapped or mirrored axis is invisible with one button and obvious with five.
; Repaints only on a press (a redraw loop resets this panel), and re-arms first.
[env:tfttouch]
extends = s3
build_src_filter = -<*> +<bringup/tfttouch.cpp>

[env:tfttouch-uart]
extends = env:tfttouch
build_flags = ${env:tfttouch.build_flags} -UARDUINO_USB_CDC_ON_BOOT -DARDUINO_USB_CDC_ON_BOOT=0

; Freenove CYD audio bring-up: ES8311 codec beep + mic/speaker loopback. Validated
; by ear (speak during the record, hear it echoed). No console needed.
[env:audio-cyd]
extends = s3
build_src_filter = -<*> +<bringup/audio_cyd.cpp>
build_unflags = -DSOLIDE_BOARD=solide_s3
build_flags = ${s3.build_flags} -DSOLIDE_BOARD=freenove_s3

; Freenove CYD touch bring-up: FT6336U + ILI9341, on-screen quadrant feedback,
; no console needed. Validates the solide FT6336U driver in isolation.
[env:tfttouch-cyd]
extends = s3
build_src_filter = -<*> +<bringup/tfttouch_cyd.cpp>
build_unflags = -DSOLIDE_BOARD=solide_s3
build_flags = ${s3.build_flags} -DSOLIDE_BOARD=freenove_s3

[env:tftbringup]
extends = s3
build_src_filter = -<*> +<bringup/tftbringup.cpp>

; The TFT bring-up with its console on UART0 (the DevKit's "UART" USB-C port).
; That port is also the one that flashes a fresh board unaided, so this variant
; lets a single cable both flash and report - the native-USB variant's output
; goes to a port that is not plugged in during first bring-up.
;   pio run -e tftbringup-uart -t upload
[env:tftbringup-uart]
extends = env:tftbringup
build_flags = ${env:tftbringup.build_flags} -UARDUINO_USB_CDC_ON_BOOT -DARDUINO_USB_CDC_ON_BOOT=0

; Same as [env:test] but the console lives on UART0 (the DevKit's CP2102 "UART"
; USB-C port) instead of the native-USB CDC - which drops bytes on the V0.1 board.
; Flash over native USB as usual; read the console on the UART port
; (/dev/cu.usbserial-* or /dev/cu.SLAB_USBtoUART).
[env:testuart]
extends = env:test
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = ${env:test.build_flags} -UARDUINO_USB_CDC_ON_BOOT -DARDUINO_USB_CDC_ON_BOOT=0

; Standalone serial network diagnostic (NOT first-time setup/product firmware;
; it has no Nimbus setup AP or web UI). Always name the target explicitly.
;   pio run -e provision -t upload --upload-port /dev/cu.usbserial-XXXX
[env:provision]
extends = s3
build_src_filter = -<*> +<bringup/provision.cpp>

; UART-console variant used internally by tools/setup_device.py to seed a new
; board's display hardware + operating mode before production firmware boots.
[env:provision-uart]
extends = env:provision
build_unflags = -DARDUINO_USB_CDC_ON_BOOT=1
build_flags = ${s3.build_flags} -DARDUINO_USB_CDC_ON_BOOT=0

; Freenove CYD provisioning diagnostic. Same provision.cpp, but the Freenove
; pinout (SOLIDE_BOARD=freenove_s3) so it never drives Solide pins on the
; all-in-one PCB, and it stays on native USB CDC (the board has no UART bridge).
; Used by tools/setup_device.py --board freenove_s3.
[env:provision-cyd]
extends = s3
build_src_filter = -<*> +<bringup/provision.cpp>
build_unflags = -DSOLIDE_BOARD=solide_s3
build_flags = ${s3.build_flags} -DSOLIDE_BOARD=freenove_s3

; Nimbus HIL harness - pytest config (the HIL test spec).
;
; This file makes `pytest tests/hil` collect cleanly on a DEV BOX WITH NO DEVICE:
; markers are registered (so --strict-markers passes) and the default -m selector
; DESELECTS every hardware-touching test (hil/net/agent/audio/manual). Those tests
; still IMPORT and COLLECT - they are just not run - which is exactly the hard
; verification requirement (`pytest --collect-only tests/hil` == zero errors).
;
; To actually drive hardware you must both pass `-m <marker>` AND `--allow-hardware`
; (the board is single-owner/bricked; see README.md). Selecting a marker overrides
; the default deselect below.
[pytest]
minversion = 7.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; --strict-markers turns a typo'd @pytest.mark.xxx into a collection error instead
; of a silent no-op, so an unregistered marker can never hide a skipped test.
addopts =
    --strict-markers
    -ra
    -m "not (hil or net or agent or audio or manual or connectors or qa)"

markers =
    host: pure host-side test, no device (runs anywhere, always safe).
    hil: needs the device on serial (USB-CDC). Gated behind --allow-hardware.
    net: needs the device joined to a LAN / reachable over HTTP. Gated.
    agent: needs provider API keys (pushed to device) and/or network. Gated.
    audio: needs the audio board AND a human in the loop. Gated + manual.
    manual: human-assisted step (turn knob, tap mic, listen). LOUD-fails if unconfirmed.
    connectors: live provider-connector E2E lifecycle (Mistral Studio: GitHub/Gmail/Notion/Drive). Slow, side-effecting external accounts; SKIPs when a connector isn't authorized/configured. Gated + agent + net.
    qa: comprehensive pre-OTA connector + follow-up QA suite (recorded transcripts, deterministic oracle gate + independent LLM judge). Very slow, paid API, side-effecting. Gated + agent + net; run before an OTA release.

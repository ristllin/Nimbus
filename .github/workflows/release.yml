# OTA release pipeline: on a v* tag, build both OTA variants, sign the release
# manifest with the OTA_SIGNING_KEY secret (ECDSA P-256 - the device verifies
# against include/ota_pubkey.h before flipping firmware), and publish a GitHub
# Release. Devices poll releases/latest/download/manifest.json daily. docs/ota.md
# has the full scheme + the release checklist.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # platformio.ini consumes ../solide-drivers via symlink:// - recreate the
      # sibling-repo layout inside the workspace.
      - uses: actions/checkout@v4
        with:
          path: Nimbus
          fetch-depth: 0   # tools/git_version.py needs `git describe --tags`

      # solide-drivers is public - plain checkout, pinned to the validated release.
      # RELEASE_PAT now needs only: nimbus-fw-releases = Contents:write (publish
      # the release there); the default github.token is scoped to THIS repo only.
      - uses: actions/checkout@v4
        with:
          repository: ristllin/solide-drivers
          ref: fc03b8dc3fbe00e3258ffeb8e145a28308f532b5   # solide-drivers v0.5.1 (freenove CYD) - pin the SHA, a tag is mutable
          path: solide-drivers

      - name: Tag / version.h coherence gate
        working-directory: Nimbus
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(sed -n 's/#define NIMBUS_FW_VERSION "\(.*\)"/\1/p' include/version.h)
          echo "tag=$TAG version.h=$VER"
          # The tag may carry an -rcN suffix while version.h holds the base version.
          case "$TAG" in
            "$VER"|"$VER"-rc*) ;;
            *) echo "::error::tag $TAG != NIMBUS_FW_VERSION $VER"; exit 1 ;;
          esac

      # RELEASE GATE (CUM-174 #6): refuse to build/publish on a known white-screen
      # driver pin (CUM-167). Fast, no toolchain - fails the release before the
      # expensive build if the firmware still points at a denylisted driver.
      - name: Release gate - driver pin (CUM-167)
        working-directory: Nimbus
        run: python3 tools/release_gate/check_driver_pin.py

      # RELEASE GATE (CUM-174 #4 / CUM-237): the OTA update flow must write only its
      # own bookkeeping NVS keys, never an owner's settings (Wi-Fi, provider key,
      # touch cal, screen model, theme). Source guard over src/sys/ota_update.cpp;
      # fast, no toolchain. The full survive-an-OTA proof is a bench leg (MANIFEST).
      - name: Release gate - OTA preserves user NVS (CUM-237)
        working-directory: Nimbus
        run: python3 tools/release_gate/check_ota_preserves_nvs.py

      # RELEASE GATE (CUM-388 / CUM-392): every supported hardware config maps to
      # exactly one correct image across the installer, the workflow, the web-flash
      # builder, the typed device-type slugs, and the platformio envs. Fails on any
      # drift (a new/renamed config, a wrong board/panel/offset). Fast, no toolchain.
      - name: Release gate - config-to-image mapping (CUM-388)
        working-directory: Nimbus
        run: python3 tools/release_gate/check_config_mapping.py

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('Nimbus/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build firmware (every board/panel image)
        working-directory: Nimbus
        run: |
          pip install platformio
          # esp_idf_nvs_partition_gen: the NVS seed baked into each web-flash image.
          pip install esp-idf-nvs-partition-gen
          # One image per device TYPE. The Freenove sizes are DISTINCT images now:
          # each is compiled at its own panel resolution (-DNIMBUS_PANEL_W/H via its
          # env), so a 3.5"/4.0" board gets a firmware whose renderer matches its
          # glass, not a 2.8" image re-seeded.
          pio run -e esp32s3 -e esp32s3-cyd -e esp32s3-cyd-35 -e esp32s3-cyd-40
          cp .pio/build/esp32s3/firmware.bin firmware-nimbus-tft.bin
          cp .pio/build/esp32s3-cyd/firmware.bin firmware-freenove.bin
          cp .pio/build/esp32s3-cyd-35/firmware.bin firmware-freenove-35.bin
          cp .pio/build/esp32s3-cyd-40/firmware.bin firmware-freenove-40.bin

      # RELEASE GATE (CUM-174 #6 / CUM-167): the shipped TFT image must link ZERO
      # e-paper (GxEPD2) symbols (the 14.5 KB internal-SRAM win) and MUST link the
      # color-TFT plumbing. Runs on the just-built ELF, before signing/publishing.
      - name: Release gate - e-paper symbol check (CUM-167)
        working-directory: Nimbus
        run: python3 tools/release_gate/check_elf_symbols.py --elf .pio/build/esp32s3/firmware.elf

      - name: Sign + build typed OTA manifest (schema 2)
        working-directory: Nimbus
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          test -n "$OTA_SIGNING_KEY" || { echo "::error::OTA_SIGNING_KEY secret is not set"; exit 1; }
          printf '%s\n' "$OTA_SIGNING_KEY" > /tmp/ota_priv.pem
          # One typed manifest keyed on the device TYPE. Each Freenove panel size
          # is its own image, compiled at that panel's resolution, signed over its
          # own type in the message.
          python3 tools/make_manifest.py \
            --version "${GITHUB_REF_NAME}" \
            --build "$(git describe --tags --always)" \
            --key /tmp/ota_priv.pem \
            --url-base "https://github.com/ristllin/nimbus-fw-releases/releases/download/${GITHUB_REF_NAME}" \
            --out manifest.json \
            nimbus-tft=firmware-nimbus-tft.bin \
            freenove-28=firmware-freenove.bin \
            freenove-35=firmware-freenove-35.bin \
            freenove-40=firmware-freenove-40.bin
          rm -f /tmp/ota_priv.pem

      # Browser-flasher artifacts (docs site /flash, ESP Web Tools): one merged
      # full-flash image PER VARIANT, each with an NVS seed so the board comes up
      # on the right panel and knows its OTA type. The manifest's part path is the
      # ABSOLUTE raw.githubusercontent.com URL because GitHub release-asset
      # downloads send no Access-Control-Allow-Origin header - the raw host does.
      - name: Build per-variant web-flash images + manifests
        working-directory: Nimbus
        run: |
          set -e
          base="https://raw.githubusercontent.com/ristllin/nimbus-fw-releases/webflash/latest"
          for v in nimbus-tft freenove-28 freenove-35 freenove-40; do
            case "$v" in
              nimbus-tft)  dir=.pio/build/esp32s3 ;;
              freenove-28) dir=.pio/build/esp32s3-cyd ;;
              freenove-35) dir=.pio/build/esp32s3-cyd-35 ;;
              freenove-40) dir=.pio/build/esp32s3-cyd-40 ;;
            esac
            python3 tools/release/make_webflash_manifest.py \
              --variant "$v" --build-dir "$dir" \
              --version "${GITHUB_REF_NAME}" \
              --out-dir webflash \
              --base-url "$base/$v"
          done

      # Publish to the PUBLIC releases repo (devices download unauthenticated), not
      # the private source repo. tag_name creates the tag over there.
      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2 (pin the SHA - a mutable tag runs unreviewed code with secrets in scope)
        with:
          repository: ristllin/nimbus-fw-releases
          token: ${{ secrets.RELEASE_PAT }}
          tag_name: ${{ github.ref_name }}
          # The OTA images + typed manifest are release assets (devices fetch
          # them by version). The web-flash images live on the webflash branch
          # (per-variant subdirs) because their names collide as flat assets.
          files: |
            Nimbus/firmware-nimbus-tft.bin
            Nimbus/firmware-freenove.bin
            Nimbus/firmware-freenove-35.bin
            Nimbus/firmware-freenove-40.bin
            Nimbus/manifest.json
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          generate_release_notes: false

      # Fixed-path copies the docs site fetches: webflash branch of the PUBLIC repo,
      # latest/manifest.json + latest/nimbus-webflash.bin, served with CORS via
      # raw.githubusercontent.com. A fresh orphan commit is force-pushed each
      # release so the public repo never accumulates old multi-MB images. -rc tags
      # are skipped - /flash always points at the latest stable image.
      - name: Publish web-flash latest (webflash branch)
        if: ${{ !contains(github.ref_name, '-rc') }}
        env:
          RELEASE_PAT: ${{ secrets.RELEASE_PAT }}
        run: |
          mkdir webflash-branch && cd webflash-branch
          git init -b webflash
          git config user.name "nimbus-release-bot"
          git config user.email "actions@github.com"
          # One subdir per variant: latest/<variant>/{manifest.json,image,sha256}.
          for v in nimbus-tft freenove-28 freenove-35 freenove-40; do
            mkdir -p "latest/$v"
            cp "../Nimbus/webflash/$v/nimbus-webflash.bin" "latest/$v/"
            cp "../Nimbus/webflash/$v/nimbus-webflash.bin.sha256" "latest/$v/"
            cp "../Nimbus/webflash/$v/manifest.json" "latest/$v/"
          done
          git add latest
          git commit -m "web-flash ${GITHUB_REF_NAME}"
          # RELEASE_PAT is a registered Actions secret (auto-masked in logs) and no
          # `set -x` is active, so the token in this URL is not exposed. Kept simple
          # deliberately - an askpass indirection here would be untested CI plumbing.
          git push --force \
            "https://x-access-token:${RELEASE_PAT}@github.com/ristllin/nimbus-fw-releases.git" \
            webflash:webflash

  # nimbusd (Virtual Nimbus) container image, built + pushed on the SAME firmware tag
  # (CUM-444). The cloud deploy pins NIMBUSD to nimbusd:<tag>, but nothing built that
  # image, so a VN ran whatever was last pushed by hand as :latest - stale by several
  # releases. This job makes the image real per release, so a VN reports the same
  # v4.5.x a physical device does. Independent of the firmware release job (a VN image
  # failure must not block the OTA release, and vice versa).
  nimbusd-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation to GCP
    env:
      # The prod Artifact Registry the cloud deploy pulls NIMBUSD from (cumulo-nimbus
      # deploy.yml). image name `nimbusd`.
      REGISTRY: us-central1-docker.pkg.dev
      IMAGE: us-central1-docker.pkg.dev/cumulo-nimbus-prod/cumulo-nimbus/nimbusd
    steps:
      # Preflight: this job needs two owner-set repo secrets for keyless GCP auth. Until
      # they exist it CANNOT build/push, and a hard failure here would red the whole
      # release run even though the firmware OTA job (independent) published fine. So
      # detect the secrets and, when absent, skip the rest of the job with a loud notice
      # instead of failing. Once the owner sets GCP_WIF_PROVIDER + GCP_DEPLOY_SA the job
      # runs and fails loudly on any REAL build/push error, as it should.
      - name: Preflight - GCP secrets present?
        id: preflight
        run: |
          if [ -n "${{ secrets.GCP_WIF_PROVIDER }}" ] && [ -n "${{ secrets.GCP_DEPLOY_SA }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::nimbusd image skipped: set repo secrets GCP_WIF_PROVIDER and GCP_DEPLOY_SA to build+push nimbusd:${GITHUB_REF_NAME}. The firmware OTA release is unaffected."
          fi

      - if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@v4

      # Same tag/version.h coherence gate the firmware job uses: the image `fw` comes
      # from include/version.h, so refuse to build an image whose tag disagrees with it.
      - name: Tag / version.h coherence gate
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(sed -n 's/#define NIMBUS_FW_VERSION "\(.*\)"/\1/p' include/version.h)
          echo "tag=$TAG version.h=$VER"
          case "$TAG" in
            "$VER"|"$VER"-rc*) ;;
            *) echo "::error::tag $TAG != NIMBUS_FW_VERSION $VER"; exit 1 ;;
          esac

      # WIF auth. The firmware release has no GCP auth today, so this adds the standard
      # keyless Workload Identity Federation step. The owner MUST set two repo secrets
      # (documented in the lane PR body) - this workflow invents no credentials:
      #   GCP_WIF_PROVIDER  the Workload Identity Provider resource name
      #                     (projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<prov>)
      #   GCP_DEPLOY_SA     the service account email with Artifact Registry writer on
      #                     cumulo-nimbus-prod
      - name: Authenticate to Google Cloud (WIF)
        if: steps.preflight.outputs.enabled == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Configure Docker for Artifact Registry
        if: steps.preflight.outputs.enabled == 'true'
        run: gcloud auth configure-docker "${REGISTRY}" --quiet

      - name: Set up Docker Buildx
        if: steps.preflight.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@v3

      # Build once for linux/amd64 and LOAD into the local daemon (not push yet) so the
      # smoke runs against the exact image before it reaches the registry. Context is
      # the repo root (the Dockerfile needs lib/, include/, nimbusd/); the Dockerfile's
      # own build stage runs `make test`, so a broken engine never produces an image.
      - name: Build nimbusd image (linux/amd64)
        if: steps.preflight.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: nimbusd/Dockerfile
          platforms: linux/amd64
          load: true
          build-args: |
            NIMBUSD_IMAGE_TAG=nimbusd:${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}

      # Smoke: run the just-built image and prove it answers /api/state with the ENGINE
      # version (fw == NIMBUS_FW_VERSION), the exact drift CUM-444 is about. Bind the
      # control surface to 0.0.0.0 for this run only so the published port is reachable
      # from the runner (production keeps the loopback default). /api/state is gated, so
      # supply the web token.
      - name: Smoke - image answers /api/state with fw == NIMBUS_FW_VERSION
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          set -e
          VER=$(sed -n 's/#define NIMBUS_FW_VERSION "\(.*\)"/\1/p' include/version.h)
          docker run -d --name nimbusd-smoke -p 8787:8787 \
            -e NIMBUSD_WEB_TOKEN=smoke-token \
            -e NIMBUSD_CONTROL_ADDR=0.0.0.0 \
            "${IMAGE}:${GITHUB_REF_NAME}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done
          STATE=$(curl -fsS -H "X-Nimbus-Token: smoke-token" http://127.0.0.1:8787/api/state)
          echo "state: $STATE"
          echo "$STATE" | grep -q "\"fw\":\"${VER}\"" || {
            echo "::error::/api/state fw != ${VER}"; docker logs nimbusd-smoke; docker rm -f nimbusd-smoke; exit 1;
          }
          docker rm -f nimbusd-smoke

      # Push the version tag on every firmware tag; move :latest only on a stable tag
      # (never an -rc), the SAME discipline the web-flash "latest" publish uses above -
      # so a prerelease never rolls production VNs.
      - name: Push nimbusd:<tag>
        if: steps.preflight.outputs.enabled == 'true'
        run: docker push "${IMAGE}:${GITHUB_REF_NAME}"

      - name: Push nimbusd:latest (stable only)
        if: ${{ steps.preflight.outputs.enabled == 'true' && !contains(github.ref_name, '-rc') }}
        run: |
          docker tag "${IMAGE}:${GITHUB_REF_NAME}" "${IMAGE}:latest"
          docker push "${IMAGE}:latest"
